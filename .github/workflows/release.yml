name: 自动检测上游发版并发布 (Sync Upstream & Release)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specify tag to release (e.g. v0.7.16). Leave blank to auto-detect upstream latest.'
        required: false
        default: ''
      force:
        description: 'Force release even if tag already exists in this repository'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-aether-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: fawney19/Aether

jobs:
  prepare:
    name: 检查上游发版并合并补丁 (Check Upstream & Sync)
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version_tag: ${{ steps.decide.outputs.version_tag }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
      make_latest: ${{ steps.decide.outputs.make_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Determine target release and check upstream
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "should_release=false" >> "${GITHUB_OUTPUT}"
          echo "version_tag=" >> "${GITHUB_OUTPUT}"
          echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          echo "make_latest=false" >> "${GITHUB_OUTPUT}"

          TARGET_TAG=""

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TARGET_TAG="${GITHUB_REF_NAME}"
            echo "Push event for tag: ${TARGET_TAG}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            TARGET_TAG="${INPUT_TAG}"
            echo "Manual workflow_dispatch with specified tag: ${TARGET_TAG}"
          else
            echo "Checking upstream ${UPSTREAM_REPO} for releases..."
            UPSTREAM_TAG="$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=30" --jq '[.[] | select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-(beta|rc)\\.[0-9]+)?$")))] | .[0].tag_name')"

            if [[ -z "${UPSTREAM_TAG}" || "${UPSTREAM_TAG}" == "null" ]]; then
              echo "Error: No valid release found in upstream ${UPSTREAM_REPO}" >&2
              exit 1
            fi
            TARGET_TAG="${UPSTREAM_TAG}"
            echo "Latest upstream tag found: ${TARGET_TAG}"
          fi

          if [[ ! "${TARGET_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag format: ${TARGET_TAG}" >&2
            echo "Expected vX.Y.Z, vX.Y.Z-beta.N, or vX.Y.Z-rc.N" >&2
            exit 1
          fi

          EXISTS_IN_LOCAL="false"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}" >/dev/null 2>&1; then
            EXISTS_IN_LOCAL="true"
          fi

          if [[ "${EXISTS_IN_LOCAL}" == "true" && "${FORCE}" != "true" && "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "Release ${TARGET_TAG} already exists in ${GITHUB_REPOSITORY}. Skipping release."
            exit 0
          fi

          echo "Target tag to release: ${TARGET_TAG}"
          echo "should_release=true" >> "${GITHUB_OUTPUT}"
          echo "version_tag=${TARGET_TAG}" >> "${GITHUB_OUTPUT}"

          if [[ "${TARGET_TAG}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
            echo "make_latest=false" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            echo "make_latest=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Apply IP bind patch and push release tag
        if: steps.decide.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ steps.decide.outputs.version_tag }}
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/apply-patch.sh "${RUNNER_TEMP}/apply-patch.sh"
          cp .github/patches/custom_bind_host.patch "${RUNNER_TEMP}/custom_bind_host.patch"
          chmod +x "${RUNNER_TEMP}/apply-patch.sh"
          PATCH_FILE="${RUNNER_TEMP}/custom_bind_host.patch" "${RUNNER_TEMP}/apply-patch.sh"

  frontend:
    name: Build frontend
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.version_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            aether-vscodex/web/package-lock.json

      - name: Build aether-vscodex web
        working-directory: aether-vscodex/web
        run: |
          npm ci
          npm run build

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: amd64
            os: ubuntu-latest
            use_cross: true
          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: arm64
            os: ubuntu-latest
            use_cross: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.version_tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: . -> target

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@1ae7257be536a92d9218a6b343dc6e6ba650f7e1 # cross

      - name: Build
        env:
          AETHER_VERSION: ${{ needs.prepare.outputs.version_tag }}
          AETHER_BUILD_TYPE: release
          CARGO_TERM_COLOR: always
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --locked -p aether-gateway --target ${{ matrix.target }}
          else
            cargo build --release --locked -p aether-gateway --target ${{ matrix.target }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: aether-gateway-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/aether-gateway
          if-no-files-found: error
          retention-days: 1

  package:
    name: Release tarballs
    needs: [prepare, frontend, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.version_tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts

      - name: Build release packages
        env:
          VERSION: ${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          SOURCE_REF="${VERSION}"

          mkdir -p package release-assets
          for platform in linux; do
            for arch in amd64 arm64; do
              bundle="aether-${VERSION}-${platform}-${arch}"
              root="package/${bundle}"
              mkdir -p \
                "${root}/bin" \
                "${root}/frontend"

              install -m 0755 "artifacts/aether-gateway-${platform}-${arch}/aether-gateway" "${root}/bin/aether-gateway"
              cp -R artifacts/frontend-dist/. "${root}/frontend/"
              sed \
                -e "s|^REPO=\"\${AETHER_REPO:-.*}\"|REPO=\"\${AETHER_REPO:-${GITHUB_REPOSITORY}}\"|" \
                -e "s/^SOURCE_REF=\"\${AETHER_SOURCE_REF:-main}\"/SOURCE_REF=\"\${AETHER_SOURCE_REF:-${SOURCE_REF}}\"/" \
                -e "s/^VERSION=\"\${AETHER_VERSION:-}\"/VERSION=\"\${AETHER_VERSION:-${VERSION}}\"/" \
                install.sh > "${root}/install.sh"
              chmod 0755 "${root}/install.sh"
              install -m 0755 update.sh "${root}/update.sh"
              install -m 0644 docker-compose.yml "${root}/docker-compose.yml"
              install -m 0644 docker-compose.single-node.yml "${root}/docker-compose.single-node.yml"
              install -m 0644 .env.example "${root}/.env.example"
              install -m 0755 generate_keys.sh "${root}/generate_keys.sh"
              install -m 0644 README.md "${root}/README.md"
              install -m 0644 LICENSE "${root}/LICENSE"

              tar -C package -czf "release-assets/${bundle}.tar.gz" "${bundle}"
            done
          done

          sed \
            -e "s|^REPO=\"\${AETHER_REPO:-.*}\"|REPO=\"\${AETHER_REPO:-${GITHUB_REPOSITORY}}\"|" \
            -e "s/^SOURCE_REF=\"\${AETHER_SOURCE_REF:-main}\"/SOURCE_REF=\"\${AETHER_SOURCE_REF:-${SOURCE_REF}}\"/" \
            -e "s/^VERSION=\"\${AETHER_VERSION:-}\"/VERSION=\"\${AETHER_VERSION:-${VERSION}}\"/" \
            install.sh > release-assets/install.sh
          chmod +x release-assets/install.sh
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS)

      - name: Attest release package provenance
        id: attest-release
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/install.sh
            release-assets/SHA256SUMS

      - name: Bundle release package provenance
        continue-on-error: true
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-release.outputs.bundle-path }}
        run: |
          if [[ -n "${ATTESTATION_BUNDLE:-}" && -f "${ATTESTATION_BUNDLE:-}" ]]; then
            install -m 0644 "${ATTESTATION_BUNDLE}" release-assets/AETHER_RELEASE_PROVENANCE.sigstore.json
          else
            echo "{}" > release-assets/AETHER_RELEASE_PROVENANCE.sigstore.json
          fi

      - name: Upload release package artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub Release assets
    needs: [prepare, package]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release package artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: release-assets

      - name: Delete stale draft releases for tag
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          draft_ids="$(gh api "repos/${REPOSITORY}/releases" --paginate --jq '.[] | select(.tag_name == env.RELEASE_TAG and .draft == true) | .id' 2>/dev/null || true)"

          if [[ -z "${draft_ids}" ]]; then
            echo "No stale draft releases for ${RELEASE_TAG}"
            exit 0
          fi

          while IFS= read -r release_id; do
            [[ -z "${release_id}" ]] && continue
            echo "Deleting stale draft release ${release_id} for ${RELEASE_TAG}"
            gh api -X DELETE "repos/${REPOSITORY}/releases/${release_id}"
          done <<< "${draft_ids}"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.version_tag }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.make_latest }}
          files: |
            release-assets/*.tar.gz
            release-assets/AETHER_RELEASE_PROVENANCE.sigstore.json
            release-assets/SHA256SUMS
            release-assets/install.sh
